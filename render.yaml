services:
  - type: web
    name: discord-image-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DISPLAY_TZ
        value: Asia/Manila
      - key: IMAGE_PROVIDER
        value: pollinations
      - key: DISCORD_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: POLLINATIONS_TOKEN
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VIDEO_PROVIDER
        value: grok
      - key: DATABASE_URL
        sync: false
